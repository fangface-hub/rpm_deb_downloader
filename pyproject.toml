[project]
name = "rpm-deb-downloader"
version = "1.2.0"
description = "Resolve RPM/DEB dependencies and download packages."
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
  "requests",
  "zstandard",
  "cryptography",
]

[project.optional-dependencies]
build = [
  "nuitka>=4.1.3",
  "ordered-set",
]

[tool.setuptools]
py-modules = [
  "deb_metadata_parser",
  "deb_repository_client",
  "deb_service",
  "downloader",
  "http_client",
  "i18n",
  "loggingex",
  "main_window",
  "package_json_editor_window",
  "package_service",
  "pathlibex",
  "proxy_settings_dialog",
  "repo_json_editor_window",
  "rpm_repository_client",
  "rpm_resolver",
  "rpm_service",
  "signalex",
  "tkinterex",
  "treeviewex",
]
