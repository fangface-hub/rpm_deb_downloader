name: Build Windows App, Zip and Sign with Cosign (OIDC)

on:
  workflow_dispatch:

permissions:
  id-token: write
  contents: write

jobs:
  build-sign-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          lfs: true

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.14"

      - name: Install uv
        run: |
          pip install uv

      - name: Install Python dependencies
        run: |
          uv sync --extra build

      - name: Install LLVM/Clang
        run: |
          choco install llvm --no-progress -y
          echo "C:\Program Files\LLVM\bin" >> $env:GITHUB_PATH

      - name: Build with Nuitka
        run: powershell -ExecutionPolicy Bypass -File .\build_nuitka.ps1

      - name: Check onefile artifact
        run: |
          if (-not (Test-Path "dist\RpmDebDownloader.exe")) {
            throw "Missing Nuitka onefile artifact: dist\RpmDebDownloader.exe"
          }

      - name: Install cosign
        uses: sigstore/cosign-installer@v3

      - name: Sign RpmDebDownloader.exe with OIDC
        run: cosign sign-blob --yes --output-signature dist/RpmDebDownloader.exe.sig dist/RpmDebDownloader.exe

      - name: Create ZIP from dist/RpmDebDownloader.exe
        run: Compress-Archive -Path dist/RpmDebDownloader.exe -DestinationPath RpmDebDownloader-windows.zip

      - name: Sign ZIP with OIDC
        run: cosign sign-blob --yes --output-signature RpmDebDownloader-windows.zip.sig RpmDebDownloader-windows.zip

      - name: Upload ZIP
        uses: actions/upload-artifact@v5
        with:
          name: rpm-deb-downloader-windows-zip
          path: RpmDebDownloader-windows.zip

      - name: Upload ZIP signature
        uses: actions/upload-artifact@v5
        with:
          name: rpm-deb-downloader-windows-signature
          path: RpmDebDownloader-windows.zip.sig

      - name: Extract version from pyproject.toml
        id: version
        run: |
          $content = Get-Content pyproject.toml -Raw
          $match = [regex]::Match($content, 'version\s*=\s*"(\d+\.\d+\.\d+)"')
          if (-not $match.Success) {
            throw "Failed to parse version from pyproject.toml"
          }

          $version = $match.Groups[1].Value
          echo "VERSION=$version" >> $env:GITHUB_OUTPUT
          echo "TAG=v$version" >> $env:GITHUB_OUTPUT
          echo "NAME=RpmDebDownloader v$version (Windows ZIP)" >> $env:GITHUB_OUTPUT

      - name: Upload assets to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.TAG }}
          name: ${{ steps.version.outputs.NAME }}
          draft: false
          prerelease: true
          overwrite_files: true
          files: |
            RpmDebDownloader-windows.zip
            RpmDebDownloader-windows.zip.sig
