name: Build Windows App, Zip and Sign with Cosign (OIDC)

on:
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  build-sign-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          lfs: true

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install Python dependencies
        run: |
          pip install -r requirements.txt
          pip install -e .[build]

      - name: Install LLVM/Clang
        run: |
          choco install llvm --no-progress -y
          echo "C:\Program Files\LLVM\bin" >> $env:GITHUB_PATH

      - name: Build with Nuitka
        run: powershell -ExecutionPolicy Bypass -File .\build_nuitka.ps1

      - name: Check onefile artifact
        run: |
          if (-not (Test-Path "dist\RpmDebDownloader.exe")) {
            throw "Missing Nuitka onefile artifact: dist\RpmDebDownloader.exe"
          }

      - name: Install cosign
        uses: sigstore/cosign-installer@v3

      - name: Sign RpmDebDownloader.exe with OIDC
        run: cosign sign-blob --yes --output-signature dist/RpmDebDownloader.exe.sig dist/RpmDebDownloader.exe

      - name: Create ZIP from dist/RpmDebDownloader.exe
        run: Compress-Archive -Path dist/RpmDebDownloader.exe -DestinationPath RpmDebDownloader-windows.zip

      - name: Sign ZIP with OIDC
        run: cosign sign-blob --yes --output-signature RpmDebDownloader-windows.zip.sig RpmDebDownloader-windows.zip

      - name: Upload ZIP
        uses: actions/upload-artifact@v5
        with:
          name: rpm-deb-downloader-windows-zip
          path: RpmDebDownloader-windows.zip

      - name: Upload ZIP signature
        uses: actions/upload-artifact@v5
        with:
          name: rpm-deb-downloader-windows-signature
          path: RpmDebDownloader-windows.zip.sig
